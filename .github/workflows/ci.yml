name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check --timeout 30 --retries 2 -e '.[dev]'
        timeout-minutes: 5
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: tla-repair schema-info

  java-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install --disable-pip-version-check --timeout 30 --retries 2 -e '.[dev]'
        timeout-minutes: 5
      - name: Download pinned official TLA+ tools
        run: |
          curl --fail --location --connect-timeout 15 --max-time 120 --retry 2 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$RUNNER_TEMP/tla2tools.jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check
      - run: TLA_TOOLS_JAR="$RUNNER_TEMP/tla2tools.jar" pytest tests/test_verifier.py tests/test_benchmark_validation.py
